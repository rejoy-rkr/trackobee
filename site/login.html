<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackobee - Sign in</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2127;--card:#fff;--line:#d9dde2;--mut:#6b7280;--ac:#f5b301}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e6e8eb;--card:#1d2125;--line:#2e343a;--mut:#9aa3ad}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:16px;box-sizing:border-box}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{margin:0 0 4px;font-size:24px}h1 span{color:var(--ac)}p{color:var(--mut);margin:0 0 18px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#111;font:inherit;font-weight:600;cursor:pointer}
.sw{margin-top:14px;text-align:center;font-size:13px;color:var(--mut)}.sw a{color:var(--fg);cursor:pointer;text-decoration:underline}
#err{color:#c62828;font-size:13px;margin-top:10px;min-height:16px}.hide{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/api.js"></script>
</head><body><form class="box" id="f">
<h1>Track<span>obee</span></h1><p id="sub">Sign in to your workspace</p>
<div id="su" class="hide"><label>Organization name</label><input id="org" autocomplete="organization">
<label>Your name</label><input id="name" autocomplete="name"></div>
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password <span id="hint" class="hide">(min 10 characters)</span></label><input id="pw" type="password" autocomplete="current-password" required>
<button id="go">Sign in</button><div id="err" role="alert"></div>
<div class="sw" id="sw"></div></form>
<script>
const $=id=>document.getElementById(id);let mode="login";
const msg=t=>$("err").textContent=t||"";
function draw(){const s=mode=="signup";$("su").classList.toggle("hide",!s);$("hint").classList.toggle("hide",!s);
 $("go").textContent=s?"Request workspace":"Sign in";$("sub").textContent=s?"Request a workspace for your organization. It becomes active once the platform owner approves it.":"Sign in to your workspace";
 $("pw").autocomplete=s?"new-password":"current-password";
 $("sw").innerHTML=s?'Have an account? <a id="t">Sign in</a>':'New here? <a id="t">Request a workspace</a>';
 $("t").onclick=()=>{mode=s?"login":"signup";msg("");draw()}}
async function route(){const s=await TB.status();
 if(s.status=="ok"){location.href=s.role=="owner"?"owner.html":"app.html";return true}
 await TB.signOut();
 msg({pending:"Your workspace request is awaiting approval.",suspended:"This workspace is suspended. Contact the platform owner.",disabled:"This account is disabled.",none:"This account has no workspace. Request one first."}[s.status]||"Could not sign in");return false}
$("f").onsubmit=async e=>{e.preventDefault();msg("");$("go").disabled=true;
 try{await TB.init();const email=$("email").value.trim(),pw=$("pw").value;
  if(mode=="signup"){
   if(pw.length<10)throw new Error("password must be at least 10 characters");
   if(!$("org").value.trim()||!$("name").value.trim())throw new Error("organization and your name are required");
   const d=await TB.signUp(email,pw);
   if(!d.session)throw new Error("Sign-up needs 'Confirm email' turned OFF in Supabase Authentication settings (see README), or this email is already registered.");
   await TB.requestWorkspace($("org").value,$("name").value);await TB.signOut();
   $("f").innerHTML='<h1>Track<span>obee</span></h1><p>Request received. You will be able to sign in as soon as the platform owner approves your workspace.</p>';
  }else{await TB.signIn(email,pw);await route()}
 }catch(err){msg(/invalid login/i.test(err.message)?"invalid email or password":err.message)}finally{$("go").disabled=false}};
draw();
TB.init().then(async()=>{const s=await TB.sb().auth.getSession();if(s.data.session)route()}).catch(e=>msg(e.message));
</script></body></html>
