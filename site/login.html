<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackobee - Sign in</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2127;--card:#fff;--line:#d9dde2;--mut:#6b7280;--ac:#f5b301}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e6e8eb;--card:#1d2125;--line:#2e343a;--mut:#9aa3ad}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{margin:0 0 4px;font-size:24px}h1 span{color:var(--ac)}p{color:var(--mut);margin:0 0 18px}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#111;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6}
.sw{margin-top:14px;text-align:center;font-size:13px;color:var(--mut)}.sw a{color:var(--fg)}
#err{color:#c62828;font-size:13px;margin-top:10px;min-height:16px}.note{font-size:12px;color:var(--mut);margin-top:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/api.js"></script>
</head><body><form class="box" id="f">
<h1>Track<span>obee</span></h1><p>Sign in to your workspace</p>
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="pw" type="password" autocomplete="current-password" required>
<button id="go">Sign in</button><div id="err" role="alert"></div>
<div class="sw">New here? <a href="signup.html">Create a workspace</a></div></form>
<script>
const $=id=>document.getElementById(id);const msg=t=>$("err").textContent=t||"";
async function route(){const s=await TB.status();
 if(s.status=="ok"){location.href=s.role=="owner"?"owner.html":"app.html";return true}
 await TB.signOut();
 msg({pending:"Your workspace is awaiting approval by the platform owner.",suspended:"This workspace is suspended. Contact the platform owner.",disabled:"This account is disabled.",none:"This account has no workspace yet. Create one first."}[s.status]||"Could not sign in");return false}
$("f").onsubmit=async e=>{e.preventDefault();msg("");$("go").disabled=true;
 try{await TB.init();await TB.signIn($("email").value.trim(),$("pw").value);await route()}
 catch(err){msg(/invalid login/i.test(err.message)?"Invalid email or password":/not confirmed/i.test(err.message)?"Please confirm your email first (check your inbox), then sign in.":err.message)}
 finally{$("go").disabled=false}};
TB.init().then(async()=>{const s=await TB.sb().auth.getSession();if(s.data.session)route()}).catch(e=>msg(e.message));
</script></body></html>
