name: Build Trackobee agent (generic binaries, no secrets)
on: { workflow_dispatch: {}, push: { tags: ["agent-v*"] } }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: packaging\build_windows.bat
        shell: cmd
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: packaging/dist/trackobee-setup.exe }
  linux:
    runs-on: ubuntu-22.04     # older glibc => runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install pyinstaller
          python -m PyInstaller --onefile --clean --name trackobee-agent-linux agent/trackobee_agent.py
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/trackobee-agent-linux }
  mac-bin:
    strategy: { matrix: { include: [ { os: macos-14, arch: arm64 }, { os: macos-13, arch: x86_64 } ] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install pyinstaller
          python -m PyInstaller --onefile --clean --name trackobee-agent-${{ matrix.arch }} agent/trackobee_agent.py
      - uses: actions/upload-artifact@v4
        with: { name: bin-${{ matrix.arch }}, path: dist/trackobee-agent-${{ matrix.arch }} }
  mac-universal:
    needs: mac-bin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: bins }
      - run: |
          lipo -create bins/bin-arm64/trackobee-agent-arm64 bins/bin-x86_64/trackobee-agent-x86_64 -output trackobee-agent
          UNIVERSAL_BIN="$PWD/trackobee-agent" sh packaging/build_macos.sh
        env:
          SIGN_APP: ${{ secrets.SIGN_APP }}   # optional
          SIGN_PKG: ${{ secrets.SIGN_PKG }}   # optional
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "packaging/dist/trackobee-agent-macos\npackaging/dist/trackobee.pkg" }
