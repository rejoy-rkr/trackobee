name: Build Trackobee agent
on: { workflow_dispatch: {} , push: { tags: ["agent-v*"] } }
env:
  TB_SERVER: ${{ secrets.TB_SERVER }}
  TB_AGENT_TOKEN: ${{ secrets.TB_AGENT_TOKEN }}
  TB_ALLOWED_ORIGINS: ${{ secrets.TB_ALLOWED_ORIGINS }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: packaging\build_windows.bat
        shell: cmd
      # Optional: sign packaging\dist\trackobee-setup.exe with signtool + your code-signing cert
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: packaging/dist/trackobee-setup.exe }
  mac-bin:
    strategy: { matrix: { include: [ { os: macos-14, arch: arm64 }, { os: macos-13, arch: x86_64 } ] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          cd packaging && python make_config.py && pip install pyinstaller
          python -m PyInstaller --onefile --clean --name trackobee-agent-${{ matrix.arch }} --add-data "config.json:." ../agent/trackobee_agent.py
      - uses: actions/upload-artifact@v4
        with: { name: bin-${{ matrix.arch }}, path: packaging/dist/trackobee-agent-${{ matrix.arch }} }
  mac-pkg:
    needs: mac-bin
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: bins }
      - run: |
          lipo -create bins/bin-arm64/trackobee-agent-arm64 bins/bin-x86_64/trackobee-agent-x86_64 -output trackobee-agent
          UNIVERSAL_BIN="$PWD/trackobee-agent" sh packaging/build_macos.sh
        env:
          SIGN_APP: ${{ secrets.SIGN_APP }}     # optional Developer ID Application identity
          SIGN_PKG: ${{ secrets.SIGN_PKG }}     # optional Developer ID Installer identity
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: packaging/dist/trackobee.pkg }
