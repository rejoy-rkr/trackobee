<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackobee - Owner</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2127;--card:#fff;--line:#e3e6ea;--mut:#6b7280;--ac:#f5b301}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e6e8eb;--card:#1d2125;--line:#2e343a;--mut:#9aa3ad}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header h1{font-size:18px;margin:0}header h1 span{color:var(--ac)}.sp{flex:1}
main{padding:0 16px 32px;max-width:1100px;margin:0 auto}h2{font-size:15px;margin:22px 0 8px}.m{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto}.pad{padding:14px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
input,button{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font:inherit}button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#111;font-weight:600}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}.on{background:#2e7d32}.off{background:#9e9e9e}.err{color:#c62828;font-size:13px;margin-top:6px}
</style></head><body>
<header><h1>Track<span>obee</span> <span class="m" style="color:var(--mut)">owner</span></h1><span class="sp"></span><span id="who" class="m"></span><button onclick="logout()">Sign out</button></header>
<main>
<h2>Pending workspace requests <span id="rc" class="m"></span></h2>
<div class="card"><table><thead><tr><th>Organization</th><th>Requester</th><th>Email</th><th>From IP</th><th>Requested</th><th></th></tr></thead><tbody id="rq"></tbody></table></div>
<h2>Workspaces</h2>
<div class="card"><table><thead><tr><th>Name</th><th>Admin</th><th>Users</th><th>Machines (24h)</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="og"></tbody></table></div>
<h2>Create a workspace manually</h2>
<div class="card pad"><div class="bar"><input id="o" placeholder="Organization"><input id="n" placeholder="Admin name"><input id="e" type="email" placeholder="Admin email"><input id="p" placeholder="Temporary password (10+)">
<button class="pri" onclick="create()">Create</button></div><div class="err" id="err"></div></div>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=s=>new Date(s*1000).toLocaleString();
async function api(path,method="GET",body){const o={method,headers:{"X-Requested-With":"tb"}};if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
 const r=await fetch(path,o);if(r.status==401){location.href="/login";throw 0}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
function draw(d){$("rc").textContent=d.requests.length?"("+d.requests.length+")":"";
 $("rq").innerHTML=d.requests.map(r=>`<tr><td>${esc(r.org)}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td>${esc(r.ip)}</td><td>${dt(r.created)}</td>
 <td><button class="pri" onclick="act(${+r.id},'approve')">Approve</button> <button onclick="act(${+r.id},'reject')">Reject</button></td></tr>`).join("")||'<tr><td class="m">No pending requests.</td></tr>';
 $("og").innerHTML=d.orgs.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.admin)}</td><td>${o.users}</td><td>${o.machines_24h}</td>
 <td><span class="b ${o.active?"on":"off"}">${o.active?"Active":"Suspended"}</span></td><td>${dt(o.created)}</td>
 <td><button onclick="toggle(${+o.id},${o.active?0:1})">${o.active?"Suspend":"Activate"}</button> <button onclick="del(${+o.id},'${esc(o.name).replace(/'/g,"")}')">Delete</button></td></tr>`).join("")||'<tr><td class="m">No workspaces yet.</td></tr>'}
async function load(){draw(await api("/api/owner/summary"))}
async function act(id,a){try{draw(await api(`/api/owner/requests/${id}/${a}`,"POST",{}))}catch(e){alert(e.message)}}
async function toggle(id,v){draw(await api("/api/owner/orgs/"+id,"PATCH",{active:v}))}
async function del(id,n){if(prompt(`This permanently deletes "${n}" and ALL its data. Type DELETE to confirm:`)==="DELETE")draw(await api("/api/owner/orgs/"+id,"DELETE"))}
async function create(){$("err").textContent="";try{draw(await api("/api/owner/orgs","POST",{org:$("o").value,name:$("n").value,email:$("e").value,password:$("p").value}));$("o").value=$("n").value=$("e").value=$("p").value=""}catch(e){$("err").textContent=e.message}}
async function logout(){await fetch("/api/auth/logout",{method:"POST",headers:{"X-Requested-With":"tb"}});location.href="/login"}
api("/api/me").then(m=>$("who").textContent=m.email);load();setInterval(load,30000);
</script></body></html>
