<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trackobee</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2127;--card:#fff;--line:#e3e6ea;--mut:#6b7280;--ac:#f5b301}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e6e8eb;--card:#1d2125;--line:#2e343a;--mut:#9aa3ad}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 12px}h1 span{color:var(--ac)}h2{font-size:15px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
.b{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.available{background:#2e7d32}.away{background:#b7791f}.locked{background:#546e7a}.offline{background:#9e9e9e}
.warn{color:#c62828;font-weight:600}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
input,button{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fc{padding:10px 12px}.fc b{display:block;margin-bottom:4px}.fc small{color:var(--mut)}
.big{font-size:22px;font-weight:700;color:#2e7d32}
</style></head><body>
<h1>Track<span>obee</span></h1>
<div class="grid" id="fac"></div>
<h2>Live — who is on which system</h2>
<div class="bar"><input id="q" placeholder="Filter user / host / IP / facility"></div>
<div class="card"><table><thead><tr><th>CRM user</th><th>Facility</th><th>Computer</th><th>Public IP</th><th>LAN IP</th><th>OS user</th><th>Status</th><th>Idle</th><th>Last seen</th></tr></thead><tbody id="live"></tbody></table></div>
<h2>Daily report</h2>
<div class="bar"><input type="date" id="d"><button onclick="load()">Load</button><a id="csv" href="#">Export CSV</a></div>
<div class="card"><table><thead><tr><th>User</th><th>Facility</th><th>Computer</th><th>IPs</th><th>First in</th><th>Last seen</th><th>Screen on</th><th>Idle</th><th>Locked</th></tr></thead><tbody id="rep"></tbody></table></div>
<h2>Login / logout events</h2>
<div class="card"><table><thead><tr><th>Time</th><th>CRM user</th><th>Facility</th><th>Computer</th><th>IP</th><th>Event</th></tr></thead><tbody id="ev"></tbody></table></div>
<h2>Facilities (IP range → site)</h2>
<div class="bar"><input id="fn" placeholder="Facility name"><input id="fc" placeholder="IP or CIDR, e.g. 203.0.113.0/28"><button onclick="addFac()">Add</button></div>
<div class="card"><table><tbody id="fl"></tbody></table></div>
<script>
const $=id=>document.getElementById(id),t=s=>new Date(s*1000).toLocaleTimeString(),m=s=>Math.floor(s/60)+"m";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LBL={available:"Available",away:"Away",locked:"Locked",offline:"Offline"};
$("d").value=new Date().toLocaleDateString("en-CA");let LIVE=[];
function drawLive(){const q=$("q").value.toLowerCase();
 const f={};LIVE.forEach(r=>{(f[r.facility]??={available:0,away:0,locked:0,offline:0})[r.state]++});
 $("fac").innerHTML=Object.entries(f).sort().map(([n,c])=>`<div class="card fc"><b>${esc(n)}</b><span class="big">${c.available}</span> available<br><small>${c.away} away · ${c.locked} locked · ${c.offline} offline</small></div>`).join("");
 $("live").innerHTML=LIVE.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>`<tr><td>${esc(r.crm_user||"— not paired")}</td><td>${esc(r.facility)}</td><td>${esc(r.host)}</td><td>${esc(r.pub_ip)}</td><td>${esc(r.ip)}</td><td class="${r.mismatch?"warn":""}">${esc(r.os_user)}${r.mismatch?" ⚠":""}</td><td><span class="b ${r.state}">${LBL[r.state]}</span></td><td>${m(r.idle)}</td><td>${t(r.last_seen)}</td></tr>`).join("")}
async function live(){try{LIVE=await (await fetch("/api/live")).json();drawLive()}catch(e){}}
async function load(){const d=$("d").value;
 const r=await (await fetch("/api/report?date="+d)).json();
 $("rep").innerHTML=r.map(a=>`<tr><td>${esc(a.user)}</td><td>${esc(a.facility||"Unmapped")}</td><td>${esc(a.host)}</td><td>${esc(a.ips.join(", "))}</td><td>${t(a.first)}</td><td>${t(a.last)}</td><td>${m(a.screen_on)}</td><td>${m(a.idle)}</td><td>${m(a.locked)}</td></tr>`).join("");
 const e=await (await fetch("/api/events?date="+d)).json();
 $("ev").innerHTML=e.map(x=>`<tr><td>${t(x.ts)}</td><td>${esc(x.crm_user||x.os_user)}</td><td>${esc(x.facility||"")}</td><td>${esc(x.host)}</td><td>${esc(x.pub_ip)}</td><td>${esc(x.type)}</td></tr>`).join("");
 $("csv").href="/api/export.csv?date="+d}
function drawFac(l){$("fl").innerHTML=l.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cidr)}</td><td><button onclick="delFac(${x.id})">Remove</button></td></tr>`).join("")}
async function loadFac(){drawFac(await (await fetch("/api/facilities")).json())}
async function addFac(){const r=await fetch("/api/facilities",{method:"POST",body:JSON.stringify({name:$("fn").value,cidr:$("fc").value})});
 if(!r.ok)return alert("Invalid IP/CIDR");drawFac(await r.json());$("fn").value=$("fc").value=""}
async function delFac(id){drawFac(await (await fetch("/api/facilities?id="+id,{method:"DELETE"})).json())}
$("q").oninput=drawLive;live();load();loadFac();setInterval(live,5000);
</script></body></html>
