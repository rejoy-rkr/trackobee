# Trackobee Supabase config. `supabase config push` only changes properties declared here (check `supabase config diff` first).
project_id = "trackobee"

[functions.tb-manage-users]
verify_jwt = true

[functions.tb-events]
verify_jwt = false      # callers authenticate with their organization's API key instead of a Supabase JWT

[auth.email]
enable_confirmations = false    # self-serve sign-up: users get a session immediately (turn on + configure SMTP to require email confirmation)
